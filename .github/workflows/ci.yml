name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22]

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  # Install the exact tarball that would be published and exercise the real
  # `tt` entrypoint. This catches broken `dist`/`files`/`bin` wiring and
  # platform-specific failures before users install a release.
  smoke:
    name: smoke (${{ matrix.os }}, node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Pack and smoke test the shipped artifact
        shell: bash
        run: |
          set -euo pipefail
          tarball="$(npm pack | tail -n 1)"
          tarball_path="$(pwd)/${tarball}"
          smoke_dir="$(mktemp -d)"
          cd "${smoke_dir}"
          npm init -y >/dev/null
          npm install "${tarball_path}" --silent
          npx --no-install tt --version
          npx --no-install tt --help >/dev/null
          npx --no-install tt status --json >/dev/null
