name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  windows:
    uses: ./.github/workflows/windows.yml

  ci:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22]

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  # Install the exact tarball that would be published and exercise the real
  # `tt` entrypoint. This catches broken `dist`/`files`/`bin` wiring and
  # platform-specific failures before users install a release.
  smoke:
    name: smoke (${{ matrix.os }}, node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Pack and smoke test the shipped artifact
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const names = Object.keys(JSON.parse(readFileSync('package.json', 'utf8')).bin);
          assert.equal(new Set(names.map(name => name.toLowerCase())).size, names.length,
            'npm binaries must not collide on case-insensitive filesystems');
          JS
          tarball="$(npm pack | tail -n 1)"
          tarball_path="$(pwd)/${tarball}"
          smoke_dir="$(mktemp -d)"
          cd "${smoke_dir}"
          npm init -y >/dev/null
          npm install "${tarball_path}" --silent
          # Check the bundled dependency fixes after a consumer installation:
          # npm ignores this package's overrides when installing it as a dependency.
          npm audit --omit=dev --audit-level=high
          npx --no-install tt --version
          npx --no-install tt --help >/dev/null
          npx --no-install tt status --json >/dev/null
          if [[ "$RUNNER_OS" == macOS ]]; then
            ./node_modules/.bin/TT --version
            ./node_modules/.bin/TT --help >/dev/null
          fi
          # Real global installs exercise npm's bin-link creation. Repeat to
          # catch upgrade/reinstall races as well as first-install failures.
          npm install -g --ignore-scripts --no-audit --no-fund --prefix "${smoke_dir}/global" "${tarball_path}"
          npm install -g --ignore-scripts --no-audit --no-fund --prefix "${smoke_dir}/global" "${tarball_path}"
          "${smoke_dir}/global/bin/tt" --version

  hardware-guidance:
    name: hardware guidance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check OS profiles and native CPU/RAM discovery
        run: npm run test:cli -- src/__tests__/hardware-guidance.test.ts
